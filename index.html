<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sneaker Drop</title>

  <!-- Telegram Web App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <div class="app">
    <h1>Sneaker Drop</h1>
    <p class="subtitle">Лимитированные кроссовки. Оригинал.</p>

    <div class="buttons">
      <button onclick="openCatalog('new')">Новинки</button>
      <button onclick="openCatalog('sale')">Акции</button>
    </div>

    <!-- Каталог -->
    <div id="catalog" class="section hidden">
      <h2 id="catalogTitle">Каталог</h2>
      <div id="catalogList"></div>
      </div>
    

    <!-- Как купить -->
    <div id="how" class="section hidden">
      <h2>Как купить</h2>
      <ol>
        <li>Выберите модель</li>
        <li>Оставьте заявку</li>
        <li>Менеджер свяжется с вами</li>
      </ol>
    </div>

    <!-- Форма -->
    <div id="form" class="section hidden">
      <h2>Заявка</h2>

      <input id="name" placeholder="Ваше имя" />
      <input id="contact" placeholder="Telegram или телефон" />
      <input id="model" placeholder="Модель" readonly />

      <button id="sendBtn" onclick="sendForm()">Отправить заявку</button>
      <p id="status"></p>
    </div>
  </div>

  <script src="app.js?v=302"></script>
</body>
</html>
